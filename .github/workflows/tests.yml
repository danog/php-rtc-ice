name: ICE TESTS

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: ["8.2", "8.3", "8.4", "8.5"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: sockets

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Configure Linux network (multicast, IPv6, rp_filter)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo ip link set lo multicast on
          sudo sysctl -w net.ipv4.conf.all.rp_filter=0
          sudo sysctl -w net.ipv4.conf.default.rp_filter=0
          sudo sysctl -w net.ipv4.conf.lo.rp_filter=0
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=0
          # Unique-local on loopback so ICE can gather a non-::1 IPv6 host candidate.
          sudo ip -6 addr add fd00:1:2:3::1/128 dev lo || true
          # Dummy NIC with multicast so group traffic is delivered locally
          # (loopback has no MULTICAST flag on GitHub-hosted Ubuntu).
          sudo ip link add mdns0 type dummy
          sudo ip link set mdns0 up multicast on
          sudo ip addr add 172.31.255.1/24 dev mdns0
          sudo ip route replace 224.0.0.0/4 dev mdns0
          sudo sysctl -w net.ipv4.conf.mdns0.rp_filter=0
          sudo sysctl -w net.ipv4.conf.mdns0.mc_forwarding=1 || true

      - name: Configure macOS network (multicast, IPv6, firewall)
        if: matrix.os == 'macos-latest'
        run: |
          sudo ifconfig lo0 multicast || true
          sudo route -n add -net 224.0.0.0/4 -interface lo0 || true
          sudo ifconfig lo0 inet6 fd00:1:2:3::1/128 alias || true
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off || true

      - name: Configure Windows network (firewall, weak host, IPv6)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Host-candidate sockets bind a LAN address. The public-profile firewall
          # drops hairpin UDP to that address (Coturn / mDNS / ICE checks), which
          # Linux does not. Disable it so the same-interface path works.
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          Get-NetFirewallProfile | Format-Table Name, Enabled
          Get-NetIPInterface | ForEach-Object {
            Set-NetIPInterface -InterfaceIndex $_.InterfaceIndex `
              -WeakHostSend Enabled -WeakHostReceive Enabled -ErrorAction SilentlyContinue
          }
          netsh interface ipv6 add address "Loopback Pseudo-Interface 1" fd00:1:2:3::1
          netsh interface ipv6 show address

      - name: Install Coturn (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y coturn
          # The PHPUnit suite owns the Coturn process and its lifecycle.
          sudo systemctl stop coturn || true

      - name: Install Coturn (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install coturn

      - name: Install Coturn (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Coturn ships no official Windows package; this is a pinned, checksum-verified
          # Cygwin build (turnserver.exe plus its cygwin DLLs). The suite spawns and owns it.
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/SjoerdNLD/coturn_cygwin_build/releases/download/4.10.0/turnserver_4.10.0_cygwinbuild.zip'
          $zip = "$env:RUNNER_TEMP\coturn.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $expected = '5F319594EECBA0A15251C1D78B8014B8878BF9E2A40C70DEE79B8EE5D9FA047C'
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "coturn zip checksum mismatch: got $actual" }
          Expand-Archive -Path $zip -DestinationPath 'C:\coturn' -Force
          # turnserver.exe loads its cygwin DLLs from its own directory, so put that on PATH.
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\coturn\turnserver_4.10.0'
          Get-ChildItem 'C:\coturn\turnserver_4.10.0'

      - name: Probe cygwin Coturn STUN/TURN (Windows diagnostics)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $dir = 'C:\coturn\turnserver_4.10.0'
          $conf = "$env:RUNNER_TEMP\probe-turn.conf"
          $lines = @(
            'listening-port=3478',
            'listening-ip=127.0.0.1',
            'relay-ip=127.0.0.1',
            'external-ip=127.0.0.1',
            'realm=quasarstream.com',
            'lt-cred-mech',
            'user=quasarstream:123',
            'no-tls',
            'no-dtls',
            'allow-loopback-peers',
            'verbose',
            'simple-log',
            'log-file=/cygdrive/c/turnprobe.log'
          )
          Set-Content -Encoding ascii -Path $conf -Value $lines
          if (Test-Path 'C:\turnprobe.log') { Remove-Item 'C:\turnprobe.log' -Force }
          # turnserver logs to its own cygwin path (reliable, unlike the redirected stdout of a
          # cygwin exe). Give it a few seconds to bind, then read the verbose startup log and ask
          # the OS which 3478 listeners actually exist.
          $p = Start-Process -FilePath "$dir\turnserver.exe" -ArgumentList '-c', $conf -PassThru -NoNewWindow
          Start-Sleep -Seconds 5
          Write-Host "===== turnserver startup log ====="
          if (Test-Path 'C:\turnprobe.log') { Get-Content 'C:\turnprobe.log' } else { Write-Host 'no startup log written' }
          Write-Host "===== UDP :3478 listeners ====="
          (netstat -an -p UDP | Select-String ':3478') -join "`n"
          Write-Host "===== TCP :3478 listeners ====="
          (netstat -an -p TCP | Select-String ':3478') -join "`n"
          try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}

      - name: Run Psalm
        run: vendor/bin/psalm --no-progress

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit
        shell: bash
        env:
          PHP_RTC_COTURN_LOG: ${{ runner.temp }}/coturn-test.log

      - name: Coturn log (Windows diagnostics)
        if: ${{ always() && matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\coturn-test.log"
          if (Test-Path $log) {
            Write-Host "===== Coturn log ($log) ====="
            Get-Content $log
          } else {
            Write-Host "no Coturn log at $log"
          }
