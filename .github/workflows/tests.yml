name: ICE TESTS

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: ["8.2", "8.3", "8.4", "8.5"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install Coturn (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y coturn
          # The PHPUnit suite owns the Coturn process and its lifecycle.
          sudo systemctl stop coturn || true

      - name: Install Coturn (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install coturn

      - name: Install Coturn (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Coturn ships no official Windows package; this is a pinned, checksum-verified
          # Cygwin build (turnserver.exe plus its cygwin DLLs). The suite spawns and owns it.
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/SjoerdNLD/coturn_cygwin_build/releases/download/4.10.0/turnserver_4.10.0_cygwinbuild.zip'
          $zip = "$env:RUNNER_TEMP\coturn.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $expected = '5F319594EECBA0A15251C1D78B8014B8878BF9E2A40C70DEE79B8EE5D9FA047C'
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "coturn zip checksum mismatch: got $actual" }
          Expand-Archive -Path $zip -DestinationPath 'C:\coturn' -Force
          # turnserver.exe loads its cygwin DLLs from its own directory, so put that on PATH.
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\coturn\turnserver_4.10.0'

      - name: Enable weak host model (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Windows defaults to the strong host model: a UDP socket bound to a LAN
          # interface address cannot send to 127.0.0.1 (a different, loopback interface),
          # so ICE's host-candidate sockets never reach the local STUN/TURN server. Linux
          # uses the weak host model, where this works. Enable it on every IPv4 interface.
          Get-NetIPInterface -AddressFamily IPv4 | ForEach-Object {
            netsh interface ipv4 set interface interface="$($_.InterfaceIndex)" weakhostsend=enabled weakhostreceive=enabled | Out-Null
          }

      - name: Run Psalm
        run: vendor/bin/psalm --no-progress

      - name: Run PHPUnit tests
        # Every runner OS lacks the multicast/IPv6/STUN-gathering guarantees a subset of
        # tests need (mDNS and IPv6 coverage cannot run on GitHub's infrastructure), so the
        # skip-tolerant config is used on CI. The strict phpunit.xml stays for local runs.
        run: vendor/bin/phpunit -c phpunit-skiptolerant.xml
