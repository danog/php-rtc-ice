name: ICE TESTS

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: composer install

      - name: Install Coturn
        run: |
          sudo apt-get update
          sudo apt-get install -y coturn

          # The PHPUnit suite owns the Coturn process and its lifecycle.
          sudo systemctl stop coturn || true

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit
