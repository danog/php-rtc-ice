name: ICE TESTS

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: ["8.2", "8.3", "8.4", "8.5"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install Coturn (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y coturn
          # The PHPUnit suite owns the Coturn process and its lifecycle.
          sudo systemctl stop coturn || true

      - name: Install Coturn (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install coturn

      # Coturn has no Chocolatey package or Windows build. TURN-dependent tests
      # skip themselves when the turnserver binary is missing; host-only ICE still runs.

      - name: Run Psalm
        run: vendor/bin/psalm --no-progress

      - name: Run PHPUnit tests
        # Every runner OS lacks the multicast/IPv6/STUN-gathering guarantees a subset of
        # tests need (mDNS and IPv6 coverage cannot run on GitHub's infrastructure), so the
        # skip-tolerant config is used on CI. The strict phpunit.xml stays for local runs.
        run: vendor/bin/phpunit -c phpunit-skiptolerant.xml
